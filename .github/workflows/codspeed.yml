name: CodSpeed Benchmarks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "tests/benchmarks/**"
      - "src/tirmite/**"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
concurrency:
  group: codspeed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmarks:
    if: ${{ github.actor != 'dependabot[bot]' }} # Do not run on commits created by dependabot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: "3.14"
      - name: Install dependencies
        run: uv venv && uv pip install '.[bench]'
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          # addopts is cleared to drop the default --ignore=tests/benchmarks,
          # which would otherwise deselect the path passed here. No coverage
          # flags are involved: coverage is not part of the default addopts.
          #
          # python_files is narrowed to bench_*.py so collection is limited to
          # the benchmark modules. Without it the project-wide pattern still
          # includes test_*.py, and anything matching that under the benchmark
          # tree -- now or later -- would be collected and reported to CodSpeed
          # as a benchmark. The benchmark functions themselves are named test_*,
          # so the default python_functions pattern still finds them.
          run: uv run pytest tests/benchmarks --codspeed -o addopts="" -o python_files="bench_*.py"
          mode: simulation
