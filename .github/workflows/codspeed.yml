name: CodSpeed Benchmarks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:
concurrency:
  group: codspeed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmarks:
    if: ${{ github.actor != 'dependabot[bot]' }} # Do not run on commits created by dependabot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: "3.14"
      - name: Install dependencies
        run: uv venv && uv pip install '.[bench]'
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          # addopts is cleared to drop the default --ignore=tests/benchmarks,
          # which would otherwise deselect the path passed here. No coverage
          # flags are involved: coverage is not part of the default addopts.
          run: uv run pytest tests/benchmarks --codspeed --no-cov -o addopts=""
          mode: simulation
