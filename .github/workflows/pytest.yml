name: Python Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      # Checkout the latest commit associated with the PR
      - uses: actions/checkout@v7
      - name: Debug matrix value
        run: echo "Python version is ${{ matrix.python-version }}"
      # Set up Miniconda
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true # Optional: update Conda to the latest version
          python-version: ${{ matrix.python-version }}
          conda-remove-defaults: true
          channels: conda-forge, bioconda
      # Install any additional dependencies not included in the pyproject.toml file
      - name: Install additional dependencies
        run: |
          #conda install -y -c conda-forge -c bioconda mummer blast hmmer mafft pip
          conda install -y -c conda-forge pip
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --retries 10 --timeout 180 --prefer-binary --progress-bar off --no-cache-dir '.[test]'
        shell: bash -l {0}
      # BLAST+ supplies makeblastdb and blastdbcmd, which the sequence
      # extraction equivalence tests shell out to. Without them those tests
      # skip, so the FASTA-vs-BLAST-database guarantee goes unchecked. Only
      # installed for the version that reports coverage, to keep the other
      # matrix jobs fast.
      #
      # Note the trade-off this accepts: BLAST-dependent behaviour is verified
      # on Python 3.14 alone. A regression that only manifests on an older
      # interpreter in a BLAST code path would not be caught here.
      - name: Install BLAST+
        if: matrix.python-version == '3.14'
        run: |
          conda install -y -c conda-forge -c bioconda blast
        shell: bash -l {0}
      # Verify pip installation
      - name: Verify Python/pip
        run: |
          python --version
          python -m pip --version
        shell: bash -l {0}
      # Fail loudly if BLAST+ is missing, rather than silently skipping the
      # equivalence tests and reporting a green run.
      - name: Verify BLAST+
        if: matrix.python-version == '3.14'
        run: |
          makeblastdb -version
          blastdbcmd -version
        shell: bash -l {0}
      # Run pytest. Coverage is enabled by addopts in pyproject.toml, so it is
      # switched off explicitly on every version except the one we report from.
      - name: Test with pytest
        if: matrix.python-version != '3.14'
        run: |
          pytest --no-cov
        shell: bash -l {0}
      - name: Test with pytest and coverage
        if: matrix.python-version == '3.14'
        run: |
          pytest
        shell: bash -l {0}
      # Upload coverage report to Codecov. Only the job above produces a
      # coverage.xml, and every matrix job would otherwise report the same
      # numbers.
      - name: Upload coverage reports to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Adamtaranto/TIRmite
