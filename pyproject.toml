[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tirmite"
description = "Map profile HMMs of transposon termini to genomic sequences for annotation of cryptic transposon variants."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Adam Taranto", email = "adam.p.taranto@gmail.com" }]

classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    'biopython>=1.70',
    "jinja2>=3.0",
    "matplotlib>=3.5",
    "pandas>=0.23.4",
    "pyfaidx",
    "pyhmmer",
    "rich",
]

dynamic = ["version"]

# Optional dependencies for testing
[project.optional-dependencies]
dev = [
    "hatch",
    "isort",
    "ipykernel",
    "mypy",
    "pydocstyle",
    "numpydoc-validation",
    "pre-commit",
    "ruff",
]
test = [
    "pytest",
    "pytest-cov",
]
bench = [
    "pytest",
    "pytest-codspeed",
]
docs = [
    "zensical",
]

[project.urls]
homepage = "https://adamtaranto.github.io/TIRmite"
documentation = "https://adamtaranto.github.io/TIRmite"
repository = "https://github.com/adamtaranto/TIRmite"

[project.scripts]
tirmite = "tirmite.cli.cli:main"

[tool.hatch.build]
source = "src"

exclude = ["environment.yml", ".github", ".vscode"]

# Ship the PEP 561 marker so that type checkers in downstream projects honour
# the inline annotations rather than treating tirmite as untyped.
[tool.hatch.build.targets.wheel]
packages = ["src/tirmite"]
# `artifacts` bypasses both the VCS-based file selection used by hatch-vcs and
# the `exclude` list above, so the HTML report's templates and static assets are
# guaranteed to ship in the wheel. tests/test_report_packaging.py fails the suite
# rather than let a broken wheel out.
artifacts = [
    "src/tirmite/py.typed",
    "src/tirmite/report/templates/*",
    "src/tirmite/report/assets/*",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.vcs]
tag-pattern = "v*"         # Git tags starting with 'v' will be used for versioning
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/tirmite/_version.py"

[tool.pytest.ini_options]
# Benchmarks are heavy and only meaningful under CodSpeed; exclude them from the
# normal test run. Run them explicitly with: pytest tests/benchmarks --codspeed
# Coverage is not enabled by default: CI measures it on one Python version only,
# and coverage tracing would skew the CodSpeed benchmark timings. For a local
# report run: pytest --cov=tirmite --cov-report=term
addopts = "-v --ignore=benchmarks"
# `tests` is the default root, and the --ignore above prunes tests/benchmarks
# from the walk, so a bare `pytest` never collects a benchmark. Note that
# --ignore only prunes recursion: naming the path on the command line still
# collects it, which is how the CodSpeed job (and a local run) opts in.
testpaths = ["tests"]
# `bench_*.py` is listed so files under benchmarks/ are collected when that
# directory is named explicitly. No such files exist under tests/.
# The CodSpeed job narrows this to `bench_*.py` alone (-o python_files=...) so a
# stray `tests/**/test_*.py` can never be picked up as a benchmark.
python_files = ["test_*.py", "bench_*.py"]
markers = [
    "slow: tests that shell out to BLAST+ repeatedly; deselect with -m 'not slow'",
]

[tool.ruff]
# Must match `requires-python` above.
target-version = "py310"
line-length = 88
fix = true

[tool.ruff.lint]
select = [
    "C", # mccabe rules
    "F", # pyflakes rules
    "E", # pycodestyle error rules
    "W", # pycodestyle warning rules
    "B", # flake8-bugbear rules
    "I", # isort rules
    #"D", # pydocstyle rules
]
ignore = [
    "C901", # max-complexity-10
    "E501", # line-too-long
    "I001", # isort-imports - Comment out to let ruff handle import sorting
    "B905", # `zip()` without an explicit `strict=` parameter
]

# Don't auto-fix docstring issues - they're too fragile
unfixable = ["D"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"] # Ignore all pydocstyle rules in tests

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
indent-style = "space"
quote-style = "single"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["tirmite"]
known-third-party = ["Bio", "jinja2", "matplotlib", "pandas", "pyhmmer"]

[tool.isort]
profile = "black"
known_third_party = ["Bio", "jinja2", "matplotlib", "pandas", "pyhmmer"]
known_first_party = ["tirmite"]
default_section = "THIRDPARTY"
force_sort_within_sections = true

[tool.numpydoc_validation]
checks = [
    "all",  # report on all checks
    "ES01", # but don't require an extended summary
    "EX01", # or examples
    "SA01", # or a see also section
    "SS06", # and don't require the summary to fit on one line
]
exclude = [ # don't report on checks for these
    '\.__init__$',
    '\.__repr__$',
    '\.__str__$',
]
override_SS05 = [ # allow docstrings to start with these words
    '^Process ',
    '^Assess ',
    '^Access ',
]

# Don't process filepaths that match these regex patterns
exclude_files = [
    '^_version\\.py$',
]

[tool.mypy]
# Type hint strictness settings.
# Must match `requires-python`; see the note on [tool.ruff] target-version.
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# Check only our own code. Without this, mypy consumes whatever inline
# annotations happen to be installed, so the result depends on the environment
# rather than on the source: biopython, pyhmmer and rich ship `py.typed`, while
# pandas and pyfaidx do not, and which of those is true decides whether an
# import raises `import-untyped` or `import-not-found`. CI runs Python 3.10 and
# local dev runs 3.12, which resolve different dependency versions, so a routine
# upgrade could flip an error code and fail a blocking build for reasons that
# have nothing to do with the change under test. Third-party types are treated
# as `Any` everywhere instead.
#
# The cost is real: calls into biopython, pyhmmer and rich are no longer
# checked against their signatures. The trade is deliberate -- this job gates
# merges, so it must fail only on our own mistakes.
no_site_packages = true

# Only meaningful because the two settings above make the set of expected
# import errors deterministic. It keeps the suppressions below honest: an ignore
# that stops being needed is now an error rather than silent debris.
warn_unused_ignores = true

# With `no_site_packages`, every third-party import is unresolvable, so each one
# must be declared here. That is the point: adding a dependency without adding
# it to this list is a loud error, which forces a deliberate decision about
# whether its types should be trusted rather than silently inheriting them.
[[tool.mypy.overrides]]
module = [
    "Bio.*",
    "jinja2.*",
    "matplotlib.*",
    "pandas.*",
    "pyfaidx.*",
    "pyhmmer.*",
    "rich.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Generated by hatch-vcs at build time, so it is absent in a fresh checkout that
# has not been installed. First-party, but unresolvable for the same reason.
module = "tirmite._version"
ignore_missing_imports = true

# arg-type, attr-defined, union-attr and index were previously disabled for the
# whole package. Measurement showed all 21 resulting errors are confined to
# three CLI modules, so the codes are now enabled everywhere and suppressed only
# there. That restores real checking across 27 of the 30 source modules,
# including all of tirmite.core, tirmite.utils and tirmite.runners.

# Per-module suppressions. Each entry is a backlog to burn down, not a
# permanent exemption.
[[tool.mypy.overrides]]
# 7 arg-type (Path vs str at call boundaries), 1 union-attr.
module = "tirmite.cli.legacy"
disable_error_code = ["arg-type", "union-attr"]

[[tool.mypy.overrides]]
# 6 arg-type, 4 union-attr, mostly pandas DataFrame operations.
module = "tirmite.cli.hmm_pair"
disable_error_code = ["arg-type", "union-attr"]

[[tool.mypy.overrides]]
# 2 attr-defined and 1 index, from pyhmmer objects mypy cannot fully model.
module = "tirmite.cli.hmm_build"
disable_error_code = ["attr-defined", "index"]

[tool.pydocstyle]
convention = "numpy"
match-dir = "[^\\.].*"     # matches all dirs that don't start with a dot
match = "(?!test_).*\\.py" # matches files that don't start with 'test_' but end with '.py'
