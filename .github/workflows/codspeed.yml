name: Benchmarks
on:
  push:
    branches: [main]
  pull_request:
  # Allow a manual run when investigating a performance question.
  workflow_dispatch:
jobs:
  benchmarks:
    if: ${{ github.actor != 'dependabot[bot]' }} # Do not run on commits created by dependabot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[bench]"
      # --no-cov matters: coverage instrumentation would be measured along with
      # the code under test. Benchmarks live outside pytest's testpaths, so the
      # directory has to be named explicitly.
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: pytest benchmarks/ --codspeed --no-cov
